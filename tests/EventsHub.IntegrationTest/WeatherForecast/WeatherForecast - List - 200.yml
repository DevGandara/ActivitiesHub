info:
  name: WeatherForecast - List - 200
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/weatherforecast"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response returns an array", function() {
          const response = res.getBody()
          expect(response).to.be.an("array");
          expect(response.length).to.equal(5);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
